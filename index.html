<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>제12회 인천수학축전 주제탐구프로젝트 감상평</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --focus-ring: rgba(79, 70, 229, 0.15);
      --stamp-red: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px 12px 40px;
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .header-area {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 8px;
    }

    .header-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
    }

    h1 {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
    }

    .user-info-row {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background-color: #f8fafc;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      background-color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    textarea {
      resize: none;
      min-height: 54px;
      overflow-y: hidden;
      line-height: 1.5;
    }

    .notice-bar {
      background: #f8fafc;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save-indicator {
      font-size: 11px;
      color: #059669;
      font-weight: 600;
    }

    .project-card {
      background: #fbfcfe;
      border: 1px solid #edf2f7;
      border-radius: 16px;
      padding: 15px 13px;
      margin-bottom: 14px;
    }

    .project-card:focus-within {
      border-color: #cbd5e1;
      background: #ffffff;
    }

    .project-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .number-pill {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .project-field {
      margin-bottom: 10px;
    }

    .project-field:last-child {
      margin-bottom: 0;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    }

    .btn-edit {
      background: #f1f5f9;
      color: #475569;
      margin-bottom: 12px;
      font-size: 14px;
      padding: 12px;
    }

    .btn-edit:active {
      background: #e2e8f0;
    }

    /* 결과 / 확인증 화면 */
    #result-view {
      display: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #fef3c7;
      color: #b45309;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-badge.confirmed {
      background: #ecfdf5;
      color: #059669;
    }

    .user-profile-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin: 12px 0 16px;
    }

    .user-meta-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .user-meta-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 2px;
    }

    .review-display-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .review-display-item {
      background: #fbfcfe;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      padding: 12px;
    }

    .disp-subject-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
    }

    .disp-subject-text {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      margin: 2px 0 6px;
    }

    .disp-content-box {
      font-size: 13px;
      color: #334155;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      background: #ffffff;
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #edf2f7;
    }

    .helper-section {
      margin-top: 20px;
      text-align: center;
    }

    .btn-stamp {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.2);
    }

    .helper-hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
    }

    .stamp-wrap {
      display: none;
      margin: 20px auto 4px;
      width: 170px;
      padding: 8px 12px;
      border: 3px solid var(--stamp-red);
      border-radius: 14px;
      position: relative;
      transform: rotate(-5deg);
      animation: stampAppear 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      background: rgba(254, 242, 242, 0.4);
    }

    .stamp-wrap::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid var(--stamp-red);
      border-radius: 10px;
      pointer-events: none;
    }

    @keyframes stampAppear {
      0% { opacity: 0; transform: scale(2) rotate(-20deg); }
      100% { opacity: 1; transform: scale(1) rotate(-5deg); }
    }

    .stamp-title {
      color: var(--stamp-red);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.2;
      text-align: center;
    }

    .stamp-time {
      color: var(--stamp-red);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. 작성 화면 (form 태그 제거로 오작동 원천 차단) -->
    <div id="form-view">
      <div class="header-area">
        <div class="header-tag">제12회 인천수학축전</div>
        <h1>주제탐구프로젝트 감상평</h1>
        <p class="subtitle">4개 프로젝트 주제와 솔직한 감상평을 적어주세요.</p>
      </div>

      <div class="card">
        <div class="user-info-row">
          <div class="field-group">
            <label for="grade">구분</label>
            <select id="grade" onchange="saveDraft()">
              <option value="">선택</option>
              <option value="초등학생">초등학생</option>
              <option value="중학생">중학생</option>
              <option value="고등학생">고등학생</option>
              <option value="성인">성인</option>
            </select>
          </div>

          <div class="field-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" placeholder="재미있는 닉네임" maxlength="12" oninput="saveDraft()">
          </div>
        </div>

        <div class="notice-bar">
            💡 개인정보 보호를 위해 실명 대신 닉네임을 적어주세요.<br>
            💡 4가지 관심있는 주제를 선택해 감상평을 작성 후 제출 완료하기<br>
            💡 제출 후 확인증을 도우미에게 보여주고 확인 도장을 받기
        </div>

        <!-- 프로젝트 1~4 입력 영역 -->
        <div id="project-inputs"></div>

        <!-- onclick 직접 연결 -->
        <button type="button" id="completeBtn" class="btn btn-primary" onclick="goToConfirm()" style="margin-top: 10px;">
          작성 완료 및 확인증 보기
        </button>
      </div>
    </div>

    <!-- 2. 확인증 및 도우미 확인 화면 -->
    <div id="result-view">
      <div class="header-area">
        <div id="statusBadge" class="status-badge">도우미 확인 대기 중</div>
        <h1>관람 확인증</h1>
      </div>

      <div class="card">
        <div class="user-profile-card">
          <div class="user-meta-label">작성자</div>
          <div class="user-meta-val" id="disp-user"></div>
        </div>

        <div class="review-display-list" id="disp-reviews"></div>

        <!-- 수정하기 버튼 -->
        <button type="button" id="editBtn" class="btn btn-edit" onclick="returnToEdit()">
          ✎ 내용 수정하기
        </button>

        <!-- 도우미 확인 영역 -->
        <div class="helper-section">
          <button type="button" id="stampBtn" class="btn btn-stamp" onclick="applyStaffStampAndSubmit()">
            [도우미 전용] 확인 도장 찍기
          </button>
          <div id="helperHint" class="helper-hint">부스 도우미에게 보여주고 도장을 받으세요.</div>

          <div id="stampVisual" class="stamp-wrap">
            <div class="stamp-title">확인완료</div>
            <div id="stampDateText" class="stamp-time"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ★ 선생님의 Google Apps Script 배포 URL ★
const GAS_WEB_APP_URL = "https://script.google.com/a/macros/gclass.ice.go.kr/s/AKfycbxbkIpSf1NresA2WacVQGrxO-QvsYGjIEHYpL9PHObr4OMpSmCLgAyeGFxleLQGnmSw/exec";

    // 4개 블록 동적 렌더링
    const container = document.getElementById("project-inputs");
    for (let i = 1; i <= 4; i++) {
      const block = document.createElement("div");
      block.className = "project-card";
      block.id = "card" + i;

      block.innerHTML = `
        <div class="project-card-header">
          <div class="number-pill">${i}</div>
          <div class="project-card-title">프로젝트 #${i}</div>
        </div>
        
        <div class="project-field">
          <label for="poster${i}">관람 주제탐구프로젝트 주제</label>
          <input type="text" id="poster${i}" placeholder="관람한 프로젝트 주제" oninput="saveDraft()">
        </div>

        <div class="project-field">
          <label for="review${i}">주제탐구프로젝트 관람 후 감상평 입력</label>
          <textarea id="review${i}" placeholder="인상 깊었던 점을 자유롭게 적어주세요" oninput="autoExpand(this); saveDraft();"></textarea>
        </div>
      `;
      container.appendChild(block);
    }

    function autoExpand(field) {
      field.style.height = 'inherit';
      field.style.height = field.scrollHeight + 'px';
    }

    // 1. 실시간 자동 임시저장
    function saveDraft() {
      try {
        const draft = {
          grade: document.getElementById("grade").value,
          nickname: document.getElementById("nickname").value.trim(),
          poster1: document.getElementById("poster1").value.trim(),
          review1: document.getElementById("review1").value.trim(),
          poster2: document.getElementById("poster2").value.trim(),
          review2: document.getElementById("review2").value.trim(),
          poster3: document.getElementById("poster3").value.trim(),
          review3: document.getElementById("review3").value.trim(),
          poster4: document.getElementById("poster4").value.trim(),
          review4: document.getElementById("review4").value.trim()
        };
        localStorage.setItem("posterDraft", JSON.stringify(draft));
        const indicator = document.getElementById("saveStatus");
        if (indicator) indicator.innerText = "자동 저장됨";
      } catch (e) {}
    }

    // 2. 초기 로드 시 복원
    window.addEventListener("DOMContentLoaded", () => {
      // 1) 최종 도장 완료자
      if (localStorage.getItem("posterStamped") === "true") {
        const finalData = JSON.parse(localStorage.getItem("posterFinalData") || "{}");
        renderConfirmationView(finalData);
        displayStamp(localStorage.getItem("posterStampedTime") || "", false);
        return;
      }

      // 2) 확인증 대기 상태
      if (localStorage.getItem("isReviewFinished") === "true") {
        const draft = JSON.parse(localStorage.getItem("posterDraft") || "{}");
        restoreForm(draft);
        renderConfirmationView(draft);
        return;
      }

      // 3) 작성 중인 내용 복원
      const saved = localStorage.getItem("posterDraft");
      if (saved) {
        try {
          restoreForm(JSON.parse(saved));
        } catch(e) {}
      }
    });

    function restoreForm(data) {
      if (!data) return;
      if (data.grade) document.getElementById("grade").value = data.grade;
      if (data.nickname) document.getElementById("nickname").value = data.nickname;
      for (let i = 1; i <= 4; i++) {
        if (data['poster' + i]) document.getElementById('poster' + i).value = data['poster' + i];
        if (data['review' + i]) {
          const ta = document.getElementById('review' + i);
          ta.value = data['review' + i];
          autoExpand(ta);
        }
      }
    }

    // 3. '작성 완료 및 확인증 보기' 버튼 누를 때 (단순 직관적 실행)
    function goToConfirm() {
      const grade = document.getElementById("grade").value;
      const nickname = document.getElementById("nickname").value.trim();

      if (!grade) {
        alert("구분(초등/중등/고등/성인)을 선택해주세요.");
        document.getElementById("grade").focus();
        return;
      }

      if (!nickname) {
        alert("닉네임을 입력해주세요.");
        document.getElementById("nickname").focus();
        return;
      }

      // 4개 프로젝트 빈 칸 체크
      for (let i = 1; i <= 4; i++) {
        const p = document.getElementById("poster" + i).value.trim();
        const r = document.getElementById("review" + i).value.trim();

        if (!p) {
          alert(`프로젝트 #${i}의 주제를 입력해주세요.`);
          document.getElementById("poster" + i).focus();
          document.getElementById("card" + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        if (!r) {
          alert(`프로젝트 #${i}의 감상평을 입력해주세요.`);
          document.getElementById("review" + i).focus();
          document.getElementById("card" + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
      }

      // 통과 시 상태 저장 및 확인 화면 전환
      saveDraft();
      localStorage.setItem("isReviewFinished", "true");

      const draft = JSON.parse(localStorage.getItem("posterDraft") || "{}");
      renderConfirmationView(draft);
    }

    // 4. 내용 수정하기
    function returnToEdit() {
      localStorage.removeItem("isReviewFinished");
      document.getElementById("result-view").style.display = "none";
      document.getElementById("form-view").style.display = "block";
      window.scrollTo(0, 0);
    }

    // 확인증 화면 렌더링
    function renderConfirmationView(data) {
      document.getElementById("form-view").style.display = "none";
      document.getElementById("result-view").style.display = "block";

      document.getElementById("disp-user").innerText = `[${data.grade || ''}] ${data.nickname || ''}`;

      let html = "";
      for (let i = 1; i <= 4; i++) {
        html += `
          <div class="review-display-item">
            <div class="disp-subject-label">관람 프로젝트 #${i}</div>
            <div class="disp-subject-text">${escapeHtml(data['poster' + i] || '')}</div>
            <div class="disp-content-box">${escapeHtml(data['review' + i] || '')}</div>
          </div>
        `;
      }
      document.getElementById("disp-reviews").innerHTML = html;
      window.scrollTo(0, 0);
    }

    // 5. 도우미 확인 도장 찍기
    function applyStaffStampAndSubmit() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const timeString = `${month}월 ${date}일 ${hours}:${mins} 확인`;

      // 1) 즉각 도장 UI 표시
      displayStamp(timeString, true);

      // 2) 로컬스토리지 영구 잠금
      const draft = JSON.parse(localStorage.getItem("posterDraft") || "{}");
      localStorage.setItem("posterFinalData", JSON.stringify(draft));
      localStorage.setItem("posterStamped", "true");
      localStorage.setItem("posterStampedTime", timeString);

      // 3) 백그라운드 시트 전송
      if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("여기에_GAS")) {
        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(draft)
        }).catch(err => {
          console.warn("시트 전송 대기", err);
        });
      }
    }

    function displayStamp(timeText, isNew) {
      document.getElementById("editBtn").style.display = "none";
      document.getElementById("stampBtn").style.display = "none";
      document.getElementById("helperHint").style.display = "none";

      const badge = document.getElementById("statusBadge");
      badge.innerText = "✓ 최종 인증 완료";
      badge.className = "status-badge confirmed";

      const stamp = document.getElementById("stampVisual");
      document.getElementById("stampDateText").innerText = timeText;

      if (!isNew) {
        stamp.style.animation = "none";
      }
      stamp.style.display = "block";
    }

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
